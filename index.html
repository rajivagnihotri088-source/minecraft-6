
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Village 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">🌍 Creating your endless world...</div>

  <div id="menu">
    <h1>ENDLESS VILLAGE</h1>
    <p>Explore forests, rivers, villages and mountains!</p>
    <button id="play">PLAY WORLD</button>
    <p>WASD: Move | Mouse: Look | Space: Jump</p>
    <p>Left Click: Mine | Right Click: Place Block</p>
  </div>

  <div id="hud">
    <div id="stats">Village Spawn</div>
    <div id="target">Block: None</div>
    <div id="crosshair">+</div>
    <div id="help">
      WASD Move · Mouse Look · Space Jump<br>
      Left Click Mine · Right Click Build · 1–5 Select
    </div>
    <div id="hotbar"></div>
    <div id="notice"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
